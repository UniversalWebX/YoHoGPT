[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yohogpt"
version = "0.1.0"
description = "YoHoGPT: a coding-only LLM and autonomous software-engineering agent"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "tokenizers>=0.19",
]

[project.optional-dependencies]
data = ["datasets>=2.19", "huggingface_hub>=0.23"]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27", "websockets>=12"]
export = ["safetensors>=0.4"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29"]
all = ["yohogpt[data,serve,export,dev]", "wandb"]

[project.scripts]
yoho = "yohogpt.cli:main"

[tool.setuptools.packages.find]
include = ["yohogpt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

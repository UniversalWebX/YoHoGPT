# ~100M params, sized for 4 GB consumer GPUs (GTX 1050 Ti / 1650). Pair it with a
# 32k-vocab tokenizer:  yoho train-tokenizer ... --vocab-size 32768
name: yoho-small
vocab_size: 32768
d_model: 768
n_layers: 12
n_heads: 12
n_kv_heads: 4
multiple_of: 64
max_seq_len: 2048
rope_theta: 100000.0
tie_embeddings: true

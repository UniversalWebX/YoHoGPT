# YoHoGPT on Kubernetes
#
#   Internet -> Ingress (TLS) -> yoho-gateway (stateless chat/completions, autoscaled)
#                            \-> yoho-agent   (agent runs + sandboxes, stateful)
#   yoho-gateway / yoho-agent -> yoho-vllm (GPU inference pool, ClusterIP only)
#
# kubectl apply -f deploy/k8s/yohogpt.yaml
# Model weights are expected on the PVC `yoho-models` (export with `yoho export-hf`).
---
apiVersion: v1
kind: Namespace
metadata: {name: yohogpt}
---
apiVersion: v1
kind: Secret
metadata: {name: yoho-secrets, namespace: yohogpt}
type: Opaque
stringData:
  api-keys: "REPLACE_ME_WITH_COMMA_SEPARATED_KEYS"
  upstream-key: "REPLACE_ME_INTERNAL_KEY"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: yoho-models, namespace: yohogpt}
spec:
  accessModes: [ReadOnlyMany]
  resources: {requests: {storage: 200Gi}}
---
# ---------------------------------------------------------------- vLLM pool
apiVersion: apps/v1
kind: Deployment
metadata: {name: yoho-vllm, namespace: yohogpt}
spec:
  replicas: 2
  selector: {matchLabels: {app: yoho-vllm}}
  template:
    metadata: {labels: {app: yoho-vllm}}
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.6.3
          args: ["--model", "/models/yoho-7b", "--served-model-name", "yohogpt", "--max-model-len", "16384",
                 "--enable-prefix-caching", "--gpu-memory-utilization", "0.92",
                 "--api-key", "$(UPSTREAM_KEY)"]
          env:
            - name: UPSTREAM_KEY
              valueFrom: {secretKeyRef: {name: yoho-secrets, key: upstream-key}}
          ports: [{containerPort: 8000}]
          resources:
            limits: {nvidia.com/gpu: 1, memory: 64Gi}
          readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 120, periodSeconds: 10}
          volumeMounts: [{name: models, mountPath: /models, readOnly: true},
                         {name: shm, mountPath: /dev/shm}]
      volumes:
        - {name: models, persistentVolumeClaim: {claimName: yoho-models}}
        - {name: shm, emptyDir: {medium: Memory, sizeLimit: 16Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: yoho-vllm, namespace: yohogpt}
spec:
  selector: {app: yoho-vllm}
  ports: [{port: 8000, targetPort: 8000}]
---
# ---------------------------------------------------------------- stateless gateway
apiVersion: apps/v1
kind: Deployment
metadata: {name: yoho-gateway, namespace: yohogpt}
spec:
  replicas: 2
  selector: {matchLabels: {app: yoho-gateway}}
  template:
    metadata: {labels: {app: yoho-gateway}}
    spec:
      containers:
        - name: gateway
          image: yohogpt/yohogpt:0.1.0
          args: ["yoho", "serve", "--backend", "openai", "--upstream", "http://yoho-vllm:8000", "--port", "8080"]
          env:
            - {name: YOHO_ENABLE_AGENT, value: "0"}
            - {name: YOHO_RATE_LIMIT, value: "120"}
            - name: YOHO_API_KEYS
              valueFrom: {secretKeyRef: {name: yoho-secrets, key: api-keys}}
            - name: YOHO_UPSTREAM_KEY
              valueFrom: {secretKeyRef: {name: yoho-secrets, key: upstream-key}}
          ports: [{containerPort: 8080}]
          resources: {requests: {cpu: 500m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}
          readinessProbe: {httpGet: {path: /health, port: 8080}}
          livenessProbe: {httpGet: {path: /health, port: 8080}, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: yoho-gateway, namespace: yohogpt}
spec:
  selector: {app: yoho-gateway}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: yoho-gateway, namespace: yohogpt}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: yoho-gateway}
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
---
# ---------------------------------------------------------------- agent service
# Agent runs keep state in-process, so this is a single-replica StatefulSet with a
# rootless Docker-in-Docker sidecar that hosts the per-run sandbox containers.
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: yoho-agent, namespace: yohogpt}
spec:
  serviceName: yoho-agent
  replicas: 1
  selector: {matchLabels: {app: yoho-agent}}
  template:
    metadata: {labels: {app: yoho-agent}}
    spec:
      containers:
        - name: gateway
          image: yohogpt/yohogpt:0.1.0
          args: ["yoho", "serve", "--backend", "openai", "--upstream", "http://yoho-vllm:8000",
                 "--port", "8080", "--sandbox", "docker"]
          env:
            - {name: DOCKER_HOST, value: "tcp://localhost:2375"}
            - {name: YOHO_MAX_RUNS, value: "16"}
            - {name: YOHO_WORKSPACES, value: /workspaces}
            - name: YOHO_API_KEYS
              valueFrom: {secretKeyRef: {name: yoho-secrets, key: api-keys}}
            - name: YOHO_UPSTREAM_KEY
              valueFrom: {secretKeyRef: {name: yoho-secrets, key: upstream-key}}
          ports: [{containerPort: 8080}]
          volumeMounts: [{name: workspaces, mountPath: /workspaces}]
          readinessProbe: {httpGet: {path: /health, port: 8080}}
        - name: dind
          image: docker:27-dind-rootless
          env: [{name: DOCKER_TLS_CERTDIR, value: ""}]
          args: ["--host=tcp://127.0.0.1:2375"]
          securityContext: {privileged: true}
          volumeMounts: [{name: workspaces, mountPath: /workspaces}]
  volumeClaimTemplates:
    - metadata: {name: workspaces}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 500Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: yoho-agent, namespace: yohogpt}
spec:
  selector: {app: yoho-agent}
  ports: [{port: 80, targetPort: 8080}]
---
# ---------------------------------------------------------------- ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yohogpt
  namespace: yohogpt
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"          # token streaming
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"      # long agent sessions / websockets
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/limit-rps: "20"
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls: [{hosts: [api.yohogpt.example], secretName: yohogpt-tls}]
  rules:
    - host: api.yohogpt.example
      http:
        paths:
          - {path: /v1/agent, pathType: Prefix, backend: {service: {name: yoho-agent, port: {number: 80}}}}
          - {path: /, pathType: Prefix, backend: {service: {name: yoho-gateway, port: {number: 80}}}}
---
# ---------------------------------------------------------------- network policy
# Only the gateway/agent pods may talk to vLLM.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: vllm-internal-only, namespace: yohogpt}
spec:
  podSelector: {matchLabels: {app: yoho-vllm}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: yoho-gateway}}
        - podSelector: {matchLabels: {app: yoho-agent}}
      ports: [{port: 8000}]

# TLS-terminating reverse proxy for the YoHoGPT gateway.
# Tuned for token streaming (SSE) and long-lived agent WebSockets.
worker_processes auto;
events { worker_connections 4096; }

http {
  log_format json escape=json '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
                              '"path":"$uri","status":$status,"rt":$request_time,"req_id":"$request_id"}';
  access_log /dev/stdout json;

  # Coarse per-IP limit; fine-grained per-API-key limits live in the gateway.
  limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;
  client_max_body_size 20m;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  upstream yoho_gateway {
    server gateway:8080;
    keepalive 64;
  }

  server {
    listen 80;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
      limit_req zone=perip burst=40 nodelay;
      proxy_pass http://yoho_gateway;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      # streaming: never buffer token streams
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 900s;
      proxy_send_timeout 900s;
    }

    # agent WebSocket sessions
    location ~ ^/v1/agent/runs/[^/]+/ws$ {
      proxy_pass http://yoho_gateway;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }
  }
}
